<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letrum — ideias em poucas palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#201C24; --ink-soft:#5A5462; --ink-faint:#8A8390;
    --paper:#FFFFFF; --paper-raised:#FFFFFF; --line:#E7E7E7;
    --plum:#3B3B78; --plum-deep:#2A2A5C; --plum-wash:#EAEAF5;
    --gold:#C98A3E; --sage:#4B6B58; --danger:#B23A3A;
    --shadow:0 1px 2px rgba(32,28,36,.04), 0 8px 24px rgba(32,28,36,.06);
    --shadow-hover:0 2px 4px rgba(32,28,36,.06), 0 16px 32px rgba(32,28,36,.10);
    --font-display:'Newsreader', Georgia, serif;
    --font-ui:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-signature:'Caveat', cursive;
    --radius:14px;
  }
  [data-theme="dark"]{
    --ink:#F1EEEA; --ink-soft:#C9C2CC; --ink-faint:#8D8690;
    --paper:#1B181D; --paper-raised:#242026; --line:#37323C;
    --plum:#9C97D9; --plum-deep:#7D77BE; --plum-wash:#2E2B4F;
    --gold:#E0A85C; --sage:#6FA189; --danger:#E08585;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-hover:0 2px 4px rgba(0,0,0,.35), 0 16px 32px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  textarea{font-family:inherit;}
  ::selection{background:var(--plum-wash);color:var(--plum-deep);}
  :focus-visible{outline:2px solid var(--plum);outline-offset:3px;border-radius:4px;}
  @media (prefers-reduced-motion: no-preference){
    body,.btn,.chip,.action-btn,#toast{transition:all .2s ease;}
    .spinner{animation:spin .8s linear infinite;}
    .view-enter{animation:riseIn .4s ease both;}
    @keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    @keyframes spin{to{transform:rotate(360deg);}}
  }

  header.site-nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{max-width:680px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;}
  .brand{display:flex;align-items:baseline;gap:2px;flex-shrink:0;}
  .brand-mark{font-family:var(--font-signature);font-size:2.2rem;line-height:0;color:var(--ink);transform:translateY(5px);}
  .brand-word{font-family:var(--font-ui);font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);}
  .nav-search{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper-raised);border:1px solid var(--line);border-radius:999px;padding:8px 14px;}
  .nav-search svg{flex-shrink:0;opacity:.5;}
  .nav-search input{border:none;background:transparent;outline:none;font-family:var(--font-ui);font-size:.9rem;width:100%;color:var(--ink);}
  .nav-links{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .nav-link{font-size:.88rem;font-weight:500;color:var(--ink-soft);padding:8px 12px;border-radius:999px;}
  .nav-link:hover{background:var(--paper-raised);color:var(--ink);}
  .theme-toggle{background:var(--paper-raised);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:1rem;flex-shrink:0;}

  .btn{font-family:var(--font-ui);font-weight:600;font-size:.88rem;border:none;border-radius:999px;padding:10px 20px;display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--plum);color:#fff;}
  .btn-primary:hover{background:var(--plum-deep);}
  .btn-primary:disabled{opacity:.4;cursor:default;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-sm{padding:6px 12px;font-size:.78rem;}

  main{max-width:680px;margin:0 auto;padding:0 0 80px;}
  footer.site-footer{border-top:1px solid var(--line);margin-top:40px;padding:32px 24px 48px;text-align:center;}
  footer.site-footer .brand-mark{font-size:1.8rem;}
  footer.site-footer p{color:var(--ink-faint);font-size:.82rem;margin:6px 0 0;}

  #toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font-family:var(--font-ui);font-size:.88rem;font-weight:500;padding:12px 20px;border-radius:999px;box-shadow:var(--shadow-hover);opacity:0;pointer-events:none;z-index:100;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}

  .hero{padding:48px 24px 8px;}
  .hero-mark{font-family:var(--font-signature);font-size:5rem;color:var(--ink);opacity:.85;line-height:.6;margin-bottom:6px;}
  .hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,6vw,2.8rem);line-height:1.15;margin:0 0 14px;}
  .hero p.sub{font-family:var(--font-ui);color:var(--ink-soft);font-size:1.05rem;line-height:1.55;margin:0 0 24px;max-width:520px;}
  .landing-features{display:flex;flex-direction:column;gap:22px;margin:40px 0;padding:32px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .feature-card h3{font-family:var(--font-display);font-weight:600;font-size:1.1rem;margin:0 0 6px;}
  .feature-card p{color:var(--ink-soft);font-size:.92rem;line-height:1.55;margin:0;}
  .landing-cta-band{margin:36px 0 8px;padding:40px 28px;background:var(--ink);color:var(--paper);border-radius:var(--radius);text-align:center;}
  .landing-cta-band h2{font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin:0 0 10px;}
  .landing-cta-band p{opacity:.75;margin:0 0 20px;font-size:.92rem;}
  .landing-cta-band .btn-primary{background:var(--paper);color:var(--ink);}
  .landing-cta-band .btn-primary:hover{opacity:.85;}
  .landing-wrap{padding:0 24px;}

  .compose{display:flex;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);}
  .compose-fields{flex:1;min-width:0;}
  .compose textarea{width:100%;border:none;background:transparent;font-family:var(--font-display);font-size:1.15rem;line-height:1.5;color:var(--ink);resize:none;min-height:52px;padding:8px 0;}
  .compose textarea:focus{outline:none;}
  .compose textarea::placeholder{color:var(--ink-faint);}
  .compose-preview{position:relative;margin:8px 0;border-radius:12px;overflow:hidden;max-width:320px;}
  .compose-preview img{width:100%;display:block;}
  .compose-preview button{position:absolute;top:8px;right:8px;background:rgba(20,18,22,.7);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:.9rem;line-height:1;}
  .compose-bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .compose-tools{display:flex;align-items:center;gap:10px;}
  .compose-image-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper-raised);color:var(--plum);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
  .compose-image-btn:hover{border-color:var(--plum);}
  .compose-count{font-size:.78rem;color:var(--ink-faint);}
  .compose-count.warn{color:var(--danger);font-weight:600;}

  .post{display:flex;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);cursor:pointer;}
  .post:hover{background:var(--paper-raised);}
  .post-body-col{flex:1;min-width:0;}
  .post-reply-context{font-size:.8rem;color:var(--ink-faint);margin-bottom:4px;}
  .post-reply-context a{color:var(--plum);font-weight:600;}
  .post-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:.92rem;}
  .post-head .name{font-weight:700;color:var(--ink);}
  .post-head .handle,.post-head .time{color:var(--ink-faint);}
  .post-text{font-family:var(--font-display);font-size:1.05rem;line-height:1.5;color:var(--ink);margin:4px 0 10px;white-space:pre-wrap;word-wrap:break-word;}
  .post-image{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;max-height:380px;}
  .post-image img{width:100%;object-fit:cover;max-height:380px;}
  .post-actions{display:flex;align-items:center;gap:6px;margin-top:2px;}
  .action-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-faint);font-size:.82rem;font-family:var(--font-ui);padding:6px 10px;border-radius:999px;}
  .action-btn svg{flex-shrink:0;}
  .action-btn:hover{background:var(--plum-wash);color:var(--plum);}
  .action-btn.liked{color:var(--danger);}
  .action-btn.liked:hover{background:rgba(178,58,58,.1);}
  .action-btn.reposted{color:var(--sage);}
  .action-btn.reposted:hover{background:rgba(75,107,88,.1);}
  .action-btn.saved{color:var(--gold);}

  .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:700;font-size:.9rem;color:#fff;flex-shrink:0;background-size:cover;background-position:center;}
  .avatar.sm{width:34px;height:34px;font-size:.72rem;}
  .avatar.lg{width:64px;height:64px;font-size:1.3rem;}

  .empty-state{padding:60px 24px;text-align:center;color:var(--ink-faint);font-family:var(--font-display);font-size:1.1rem;font-style:italic;line-height:1.6;}
  .state-msg{padding:70px 24px;text-align:center;color:var(--ink-faint);font-family:var(--font-ui);}
  .state-msg.error{color:var(--ink);}
  .state-msg .btn{margin-top:16px;}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--plum);border-radius:50%;margin:0 auto 16px;}

  .main-post{padding:20px 24px;border-bottom:1px solid var(--line);}
  .main-post .post-head{font-size:.98rem;}
  .main-post .avatar{width:48px;height:48px;}
  .main-post .post-text{font-size:1.35rem;line-height:1.5;margin:14px 0;}
  .main-post .post-image{max-height:none;}
  .main-post .post-image img{max-height:none;}
  .main-post .post-time-full{color:var(--ink-faint);font-size:.85rem;margin:12px 0;}
  .main-post .post-stats{display:flex;gap:18px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.86rem;color:var(--ink-soft);}
  .main-post .post-stats b{color:var(--ink);}
  .main-post .post-actions{padding:10px 0 0;justify-content:space-around;}
  .back-link{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);font-weight:700;font-size:1.05rem;position:sticky;top:65px;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(6px);z-index:10;}
  .back-link .back-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .back-link .back-icon:hover{background:var(--paper-raised);}

  .profile-head{padding:20px 24px 0;}
  .profile-head .avatar{width:80px;height:80px;font-size:1.6rem;margin-bottom:12px;}
  .profile-head h1{font-family:var(--font-display);font-weight:600;font-size:1.5rem;margin:0 0 2px;}
  .profile-head .handle{color:var(--ink-faint);font-size:.9rem;margin:0 0 10px;}
  .profile-head .bio{color:var(--ink-soft);font-size:.94rem;line-height:1.5;margin:0 0 12px;max-width:520px;}
  .profile-stats{display:flex;gap:16px;font-size:.85rem;color:var(--ink-faint);margin-bottom:18px;flex-wrap:wrap;}
  .profile-stats b{color:var(--ink);}
  .profile-actions{display:flex;gap:10px;margin-bottom:6px;}

  .auth-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);margin:36px 24px;}
  .auth-card h1{margin:8px 0 4px;font-family:var(--font-display);font-weight:600;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;}
  .tag-select{font-family:var(--font-ui);font-size:.92rem;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);}
  .tag-select:focus{outline:none;border-color:var(--plum);}
  .write-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .hint{color:var(--ink-faint);font-size:.88rem;margin:0 0 20px;}

  .dropdown{position:relative;}
  .avatar-btn{background:none;border:none;padding:0;cursor:pointer;border-radius:50%;}
  .dropdown-menu{position:absolute;right:0;top:calc(100% + 10px);background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-hover);min-width:190px;padding:8px;display:none;flex-direction:column;z-index:60;}
  .dropdown-menu.open{display:flex;}
  .dropdown-menu a,.dropdown-menu button{text-align:left;padding:9px 12px;border-radius:8px;font-size:.88rem;font-family:var(--font-ui);background:none;border:none;color:var(--ink);cursor:pointer;}
  .dropdown-menu a:hover,.dropdown-menu button:hover{background:var(--paper);}
  .dropdown-menu button.logout{color:var(--danger);font-weight:600;}

  .response-form{display:flex;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);}
  .response-form textarea{flex:1;font-family:var(--font-display);font-size:1rem;padding:8px 0;border:none;background:transparent;color:var(--ink);resize:none;min-height:40px;}
  .response-form textarea:focus{outline:none;}
  .response-form .compose-bar{flex:1;}

  @media (max-width:640px){
    .nav-inner{padding:12px 16px;}
    .hero{padding:32px 16px 8px;}
    .landing-wrap,.compose,.post,.profile-head,.main-post,.back-link,.response-form{padding-left:16px;padding-right:16px;}
    .auth-card{margin:24px 16px;padding:24px;}
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="#/" aria-label="Letrum, início">
      <span class="brand-mark">L</span><span class="brand-word">Letrum</span>
    </a>
    <div class="nav-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar posts, pessoas...">
    </div>
    <nav class="nav-links" id="navActions"></nav>
    <button class="theme-toggle" id="themeToggle" type="button" title="Alternar tema">🌙</button>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <span class="brand-mark">L</span>
  <div class="brand-word" style="font-size:.8rem;">Letrum</div>
  <p>Onde ideias soltas viram texto que faz sentido.</p>
</footer>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = 'https://esjxazzrxamgaxpwbtai.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_xO0zuYAnTaaPhlzGkXWMYw_fXJbw3Yv';
  var POST_SELECT = 'id,body,image_url,like_count,repost_count,reply_count,created_at,parent_post_id,author_id,profiles!posts_author_id_fkey(id,username,full_name,avatar_url),parent:posts!posts_parent_post_id_fkey(id,profiles!posts_author_id_fkey(username))';
  var PALETTE = ['#3B3B78','#C98A3E','#4B6B58','#3E5C76','#9C3B4B','#5B4B8A','#2F6F6A'];
  var MAX_LEN = 280;

  var session = null;
  var myProfile = null;
  var theme = 'light';
  var state = { query: '' };

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');

  /* ---------- utils ---------- */
  function esc(str){ var d = document.createElement('div'); d.textContent = (str===undefined||str===null)?'':String(str); return d.innerHTML; }
  function normalize(str){ return String(str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function debounce(fn, wait){ var t; return function(){ var args=arguments, ctx=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(ctx,args); }, wait); }; }
  function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 3000); }
  function showLoading(msg){ app.innerHTML = '<div class="state-msg"><div class="spinner"></div>'+esc(msg||'Carregando...')+'</div>'; }
  function showError(msg, retryFn){
    app.innerHTML = '<div class="state-msg error">'+esc(msg)+'<br><button class="btn btn-ghost" id="retryBtn">Tentar de novo</button></div>';
    var b = document.getElementById('retryBtn'); if(b && retryFn) b.addEventListener('click', retryFn);
  }
  function initialsFrom(name){ var parts = String(name||'?').split(' ').filter(Boolean).slice(0,2); return parts.map(function(w){return w[0].toUpperCase();}).join('') || '?'; }
  function colorFromString(str){ str = String(str||'x'); var h=0; for(var i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); } return PALETTE[Math.abs(h)%PALETTE.length]; }
  function authorAvatar(p, size){
    var cls = 'avatar'+(size?' '+size:'');
    if(p && p.avatar_url) return '<div class="'+cls+'" style="background-image:url(\''+esc(p.avatar_url)+'\')"></div>';
    var initials = initialsFrom(p && (p.full_name || p.username));
    var color = colorFromString(p && (p.id || p.username));
    return '<div class="'+cls+'" style="background:'+color+'">'+esc(initials)+'</div>';
  }
  function timeAgo(iso){
    var diff = (Date.now() - new Date(iso).getTime())/1000;
    if(diff<60) return 'agora';
    if(diff<3600) return Math.floor(diff/60)+'min';
    if(diff<86400) return Math.floor(diff/3600)+'h';
    if(diff<86400*7) return Math.floor(diff/86400)+'d';
    var d = new Date(iso);
    return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);
  }
  function fullDate(iso){
    var d = new Date(iso);
    var months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return d.getDate()+' de '+months[d.getMonth()]+' de '+d.getFullYear()+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function icon(name){
    if(name==='reply') return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 12c0 4.4-4 8-9 8-1.4 0-2.7-.3-3.9-.8L3 20l1.1-4.4C3.4 14.4 3 13.2 3 12c0-4.4 4-8 9-8s9 3.6 9 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
    if(name==='repost') return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M7 7h10v4M7 7 4 10M7 7l3 3M17 17H7v-4m10 4 3-3m-3 3-3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    if(name==='like') return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.5-9C.8 7.6 2.6 4 6.3 4c2 0 3.6 1.3 4.2 2.6.7.9.3 2.4 1.5 2.6 1.2-.2.8-1.7 1.5-2.6C14.1 5.3 15.7 4 17.7 4c3.7 0 5.5 3.6 3.8 7-2.5 4.6-9.5 9-9.5 9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
    if(name==='save') return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18l-6-4-6 4V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
    return '';
  }

  /* ---------- API ---------- */
  function restRequest(path, opts){
    opts = opts || {};
    var headers = {
      apikey: SUPABASE_KEY,
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + ((opts.useAuth !== false && session) ? session.access_token : SUPABASE_KEY)
    };
    if(opts.prefer) headers['Prefer'] = opts.prefer;
    return fetch(SUPABASE_URL + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    }).then(function(res){
      return res.text().then(function(text){
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
        if(!res.ok){
          var msg = (data && (data.message || data.error_description || data.msg || data.error)) || ('Erro '+res.status);
          throw new Error(msg);
        }
        return data;
      });
    });
  }

  function signUp(payload){
    return restRequest('/rest/v1/profiles?username=eq.'+encodeURIComponent(payload.username)+'&select=id', {useAuth:false}).then(function(existing){
      if(existing && existing.length) throw new Error('Esse nome de usuário já está em uso.');
      return restRequest('/auth/v1/signup', { method:'POST', useAuth:false,
        body: { email: payload.email, password: payload.password, data: { username: payload.username, full_name: payload.fullName } } });
    }).then(function(data){
      if(data && data.access_token){
        session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
        return loadMyProfile().then(function(){ return {confirmed:true}; });
      }
      return {confirmed:false};
    });
  }
  function signIn(payload){
    return restRequest('/auth/v1/token?grant_type=password', { method:'POST', useAuth:false, body:{email:payload.email,password:payload.password} })
      .then(function(data){
        session = { access_token:data.access_token, refresh_token:data.refresh_token, user:data.user };
        return loadMyProfile();
      });
  }
  function signOut(){ session=null; myProfile=null; }
  function loadMyProfile(){
    if(!session) return Promise.resolve();
    return restRequest('/rest/v1/profiles?id=eq.'+session.user.id+'&select=*').then(function(rows){ myProfile = rows[0]||null; });
  }

  function fetchTimeline(query){
    var path = '/rest/v1/posts?select='+encodeURIComponent(POST_SELECT)+'&parent_post_id=is.null&order=created_at.desc&limit=50';
    if(query) path += '&body=ilike.*'+encodeURIComponent(query)+'*';
    return restRequest(path, {useAuth:false});
  }
  function fetchPost(id){
    return restRequest('/rest/v1/posts?select='+encodeURIComponent(POST_SELECT)+'&id=eq.'+id+'&limit=1', {useAuth: !!session}).then(function(r){return r[0]||null;});
  }
  function fetchReplies(postId){
    return restRequest('/rest/v1/posts?select='+encodeURIComponent(POST_SELECT)+'&parent_post_id=eq.'+postId+'&order=created_at.asc', {useAuth:false});
  }
  function fetchUserPosts(authorId){
    return restRequest('/rest/v1/posts?select='+encodeURIComponent(POST_SELECT)+'&author_id=eq.'+authorId+'&order=created_at.desc', {useAuth:false});
  }
  function fetchProfileByUsername(u){ return restRequest('/rest/v1/profiles?username=eq.'+encodeURIComponent(u)+'&select=*', {useAuth:false}).then(function(r){return r[0]||null;}); }
  function fetchFollowCounts(userId){
    return Promise.all([
      restRequest('/rest/v1/follows?following_id=eq.'+userId+'&select=follower_id', {useAuth:false}),
      restRequest('/rest/v1/follows?follower_id=eq.'+userId+'&select=following_id', {useAuth:false})
    ]).then(function(r){ return { followers: r[0].length, following: r[1].length }; });
  }
  function isFollowing(followerId, followingId){
    return restRequest('/rest/v1/follows?follower_id=eq.'+followerId+'&following_id=eq.'+followingId+'&select=follower_id', {useAuth:false}).then(function(r){return r.length>0;});
  }
  function toggleFollow(followingId){
    return isFollowing(myProfile.id, followingId).then(function(following){
      if(following) return restRequest('/rest/v1/follows?follower_id=eq.'+myProfile.id+'&following_id=eq.'+followingId, {method:'DELETE'}).then(function(){return false;});
      return restRequest('/rest/v1/follows', {method:'POST', body:{follower_id:myProfile.id, following_id:followingId}}).then(function(){return true;});
    });
  }

  function bulkMembership(table, postIds){
    if(!session || !postIds.length) return Promise.resolve({});
    return restRequest('/rest/v1/'+table+'?user_id=eq.'+myProfile.id+'&post_id=in.('+postIds.join(',')+')&select=post_id').then(function(rows){
      var set = {}; rows.forEach(function(r){ set[r.post_id] = true; }); return set;
    }).catch(function(){ return {}; });
  }
  function toggleMembership(table, postId, currentlyOn){
    if(currentlyOn) return restRequest('/rest/v1/'+table+'?post_id=eq.'+postId+'&user_id=eq.'+myProfile.id, {method:'DELETE'}).then(function(){return false;});
    return restRequest('/rest/v1/'+table, {method:'POST', body:{post_id:postId, user_id:myProfile.id}}).then(function(){return true;});
  }
  function toggleLike(postId, on){ return toggleMembership('likes', postId, on); }
  function toggleRepost(postId, on){ return toggleMembership('reposts', postId, on); }
  function toggleSavePost(postId, on){ return toggleMembership('saved_posts', postId, on); }

  function createPost(f){
    var body = { author_id: myProfile.id, body: f.body, image_url: f.imageUrl||null, parent_post_id: f.parentPostId||null };
    return restRequest('/rest/v1/posts', {method:'POST', body:body, prefer:'return=representation'}).then(function(r){return r[0];});
  }
  function deletePost(id){ return restRequest('/rest/v1/posts?id=eq.'+id, {method:'DELETE'}); }

  function uploadFile(bucket, file){
    var ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    var path = myProfile.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
    return fetch(SUPABASE_URL+'/storage/v1/object/'+bucket+'/'+path, {
      method:'POST',
      headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+session.access_token, 'Content-Type': file.type || 'application/octet-stream' },
      body:file
    }).then(function(res){
      if(!res.ok) return res.text().then(function(t){ throw new Error('Falha ao enviar arquivo: '+t); });
      return SUPABASE_URL+'/storage/v1/object/public/'+bucket+'/'+path;
    });
  }

  /* ---------- templates ---------- */
  function postTemplate(p, opts){
    opts = opts || {};
    var author = p.profiles || {};
    var liked = !!opts.liked, reposted = !!opts.reposted, saved = !!opts.saved;
    var replyCtx = (p.parent_post_id && p.parent) ? '<div class="post-reply-context">Respondendo a <a href="#/post/'+esc(p.parent.id)+'">@'+esc((p.parent.profiles&&p.parent.profiles.username)||'')+'</a></div>' : '';
    var img = p.image_url ? '<div class="post-image"><img src="'+esc(p.image_url)+'" alt="" loading="lazy"></div>' : '';
    return '<article class="post" data-post-id="'+esc(p.id)+'">'
      + authorAvatar(author)
      + '<div class="post-body-col">'
      + replyCtx
      + '<div class="post-head"><span class="name">'+esc(author.full_name||author.username||'Alguém')+'</span>'
      + '<span class="handle">@'+esc(author.username||'')+'</span><span class="time">· '+timeAgo(p.created_at)+'</span></div>'
      + '<div class="post-text">'+esc(p.body)+'</div>'
      + img
      + '<div class="post-actions">'
      + '<button class="action-btn" data-act="reply" data-id="'+esc(p.id)+'">'+icon('reply')+' <span>'+p.reply_count+'</span></button>'
      + '<button class="action-btn'+(reposted?' reposted':'')+'" data-act="repost" data-id="'+esc(p.id)+'">'+icon('repost')+' <span>'+p.repost_count+'</span></button>'
      + '<button class="action-btn'+(liked?' liked':'')+'" data-act="like" data-id="'+esc(p.id)+'">'+icon('like')+' <span>'+p.like_count+'</span></button>'
      + '<button class="action-btn'+(saved?' saved':'')+'" data-act="save" data-id="'+esc(p.id)+'">'+icon('save')+'</button>'
      + '</div></div></article>';
  }

  function bindActionButtons(container, byId, onReply){
    container.querySelectorAll('.action-btn[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        if(!session){ location.hash='#/entrar'; return; }
        var act = btn.getAttribute('data-act');
        var id = btn.getAttribute('data-id');
        if(act==='reply'){ onReply(id); return; }
        if(act==='like'){
          var wasLiked = btn.classList.contains('liked');
          toggleLike(id, wasLiked).then(function(now){
            btn.classList.toggle('liked', now);
            var span = btn.querySelector('span');
            span.textContent = parseInt(span.textContent,10) + (now && !wasLiked ? 1 : (!now && wasLiked ? -1 : 0));
          }).catch(function(err){ showToast(err.message); });
        } else if(act==='repost'){
          var wasReposted = btn.classList.contains('reposted');
          toggleRepost(id, wasReposted).then(function(now){
            btn.classList.toggle('reposted', now);
            var span = btn.querySelector('span');
            span.textContent = parseInt(span.textContent,10) + (now && !wasReposted ? 1 : (!now && wasReposted ? -1 : 0));
            showToast(now ? 'Repostado' : 'Repost desfeito');
          }).catch(function(err){ showToast(err.message); });
        } else if(act==='save'){
          var wasSaved = btn.classList.contains('saved');
          toggleSavePost(id, wasSaved).then(function(now){
            btn.classList.toggle('saved', now);
            showToast(now ? 'Salvo' : 'Removido dos salvos');
          }).catch(function(err){ showToast(err.message); });
        }
      });
    });
  }

  function bindFeedEvents(container, posts){
    var byId = {}; posts.forEach(function(p){ byId[p.id]=p; });
    container.querySelectorAll('.post').forEach(function(el){
      el.addEventListener('click', function(e){
        if(e.target.closest('.action-btn') || e.target.closest('a')) return;
        location.hash = '#/post/'+el.getAttribute('data-post-id');
      });
    });
    bindActionButtons(container, byId, function(id){ location.hash = '#/post/'+id; });
  }

  function decorateFeed(posts){
    if(!session || !myProfile || !posts.length) return Promise.resolve({liked:{}, reposted:{}, saved:{}});
    var ids = posts.map(function(p){return p.id;});
    return Promise.all([
      bulkMembership('likes', ids), bulkMembership('reposts', ids), bulkMembership('saved_posts', ids)
    ]).then(function(r){ return {liked:r[0], reposted:r[1], saved:r[2]}; });
  }

  function renderPostList(container, posts, deco){
    container.innerHTML = posts.map(function(p){
      return postTemplate(p, {liked:deco.liked[p.id], reposted:deco.reposted[p.id], saved:deco.saved[p.id]});
    }).join('');
    bindFeedEvents(container, posts);
  }

      + '<div style="display:flex;align-items:center;gap:12px;">'
      + '<span class="compose-count" id="composeCount">'+MAX_LEN+'</span>'
      + '<button class="btn btn-primary btn-sm" id="composeSubmit" disabled>'+esc(opts.buttonLabel||'Postar')+'</button>'
      + '</div></div></div></div>';

  function bindCompose(onSubmit){
    var textEl = document.getElementById('composeText');
    var countEl = document.getElementById('composeCount');
    var submitBtn = document.getElementById('composeSubmit');
    var imageBtn = document.getElementById('composeImageBtn');
    var fileInput = document.getElementById('composeFileHidden');
    var previewWrap = document.getElementById('composePreviewWrap');
    var imageUrl = null;
    var uploading = false;

    function refresh(){
      var len = textEl.value.length;
      var remaining = MAX_LEN - len;
      countEl.textContent = remaining;
      countEl.classList.toggle('warn', remaining < 0);
      submitBtn.disabled = uploading || len===0 || remaining<0 || !textEl.value.trim();
    }
    textEl.addEventListener('input', refresh);
    textEl.addEventListener('input', function(){ textEl.style.height='auto'; textEl.style.height=textEl.scrollHeight+'px'; });
    refresh();

    imageBtn.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(e){
      var f = e.target.files[0];
      if(!f) return;
      uploading = true; refresh();
      uploadFile('post-images', f).then(function(url){
        imageUrl = url;
        previewWrap.innerHTML = '<div class="compose-preview"><img src="'+esc(url)+'"><button type="button" id="composeRemoveImg">&times;</button></div>';
        document.getElementById('composeRemoveImg').addEventListener('click', function(){ imageUrl=null; previewWrap.innerHTML=''; });
      }).catch(function(err){ showToast('Erro ao enviar imagem: '+err.message); }).then(function(){ uploading=false; refresh(); });
    });

    submitBtn.addEventListener('click', function(){
      var body = textEl.value.trim();
      if(!body || body.length>MAX_LEN) return;
      submitBtn.disabled = true;
      var original = submitBtn.textContent; submitBtn.textContent = 'Postando...';
      onSubmit({body:body, imageUrl:imageUrl}).then(function(){
        textEl.value=''; imageUrl=null; previewWrap.innerHTML=''; textEl.style.height='auto';
        submitBtn.textContent = original; refresh();
      }).catch(function(err){ showToast('Erro: '+err.message); submitBtn.disabled=false; submitBtn.textContent=original; });
    });
  }

  function renderPost(id){

      replies = r;

    }).then(function(deco){
      var author = post.profiles || {};
      var replyCtx = (post.parent_post_id && post.parent) ? '<div class="post-reply-context">Respondendo a <a href="#/post/'+esc(post.parent.id)+'">@'+esc((post.parent.profiles&&post.parent.profiles.username)||'')+'</a></div>' : '';

        + '<div class="post-actions" id="mainPostActions">'
        + '<button class="action-btn" data-act="reply" data-id="'+esc(post.id)+'">'+icon('reply')+' <span>'+post.reply_count+'</span></button>'
        + '<button class="action-btn'+(reposted?' reposted':'')+'" data-act="repost" data-id="'+esc(post.id)+'">'+icon('repost')+' <span>'+post.repost_count+'</span></button>'

      ]).then(function(r){

      + '<div class="field"><label>Biografia</label><textarea class="tag-select" id="sBio" style="width:100%;min-height:100px;font-family:var(--font-ui);font-size:.94rem;">'+esc(myProfile.bio||'')+'</textarea></div>'
      + '<div class="field"><label>Foto de perfil</label><input type="file" id="sAvatar" accept="image/*"></div>'
      + '<div class="write-actions"><button class="btn btn-primary" type="submit">Salvar alterações</button></div>'
      + '</form></div>';
    document.getElementById('settingsForm').addEventListener('submit', function(e){
      e.preventDefault();
      var f = document.getElementById('sAvatar').files[0];
      (f ? uploadFile('avatars', f) : Promise.resolve(myProfile.avatar_url)).then(function(avatarUrl){
        var body = { full_name: document.getElementById('sName').value.trim(), bio: document.getElementById('sBio').value.trim(), avatar_url: avatarUrl };
        return restRequest('/rest/v1/profiles?id=eq.'+myProfile.id, {method:'PATCH', body:body, prefer:'return=representation'}).then(function(){
          myProfile = Object.assign({}, myProfile, body);
          showToast('Perfil atualizado');
          renderNav();
          location.hash = '#/perfil/'+myProfile.username;
        });
      }).catch(function(err){ showToast('Erro: '+err.message); });
    });
  }

  function renderLogin(){
    app.innerHTML = '<div class="auth-card view-enter">'
      + '<span class="brand-mark">L</span><h1>Entrar</h1>'
      + '<form id="loginForm"><div class="field"><label>E-mail</label><input class="tag-select" id="lEmail" type="email" style="width:100%;" required></div>'
      + '<div class="field"><label>Senha</label><input class="tag-select" id="lPassword" type="password" style="width:100%;" required></div>'
      + '<button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Entrar</button></form>'
      + '<button class="btn btn-ghost" id="googleBtn" type="button" style="width:100%;justify-content:center;margin-top:10px;">Entrar com Google</button>'
      + '<p class="hint" style="margin-top:18px;">Não tem conta? <a href="#/criar-conta">Criar conta</a></p>'
      + '</div>';
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = e.target.querySelector('button[type=submit]'); btn.disabled=true;
      signIn({email:document.getElementById('lEmail').value.trim(), password:document.getElementById('lPassword').value}).then(function(){
        showToast('Bem-vindo(a) de volta!'); renderNav(); location.hash='#/';
      }).catch(function(err){ showToast('Não foi possível entrar: '+err.message); btn.disabled=false; });
    });
    document.getElementById('googleBtn').addEventListener('click', function(){ showToast('Login com Google ainda não configurado neste protótipo.'); });
  }

  function renderSignup(){
    app.innerHTML = '<div class="auth-card view-enter">'
      + '<span class="brand-mark">L</span><h1>Criar conta</h1>'
      + '<form id="signupForm">'
      + '<div class="field"><label>Nome completo</label><input class="tag-select" id="suName" style="width:100%;" required></div>'
      + '<div class="field"><label>Nome de usuário</label><input class="tag-select" id="suUsername" style="width:100%;" required pattern="[a-z0-9._-]+" title="Letras minúsculas, números, pontos e traços"></div>'
      + '<div class="field"><label>E-mail</label><input class="tag-select" id="suEmail" type="email" style="width:100%;" required></div>'
      + '<div class="field"><label>Senha (mín. 6 caracteres)</label><input class="tag-select" id="suPassword" type="password" minlength="6" style="width:100%;" required></div>'
      + '<button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Criar conta</button></form>'
      + '<p class="hint" style="margin-top:18px;">Já tem conta? <a href="#/entrar">Entrar</a></p></div>';
    document.getElementById('signupForm').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = e.target.querySelector('button[type=submit]'); btn.disabled=true;
      signUp({
        email: document.getElementById('suEmail').value.trim(),
        password: document.getElementById('suPassword').value,
        username: document.getElementById('suUsername').value.trim().toLowerCase(),
        fullName: document.getElementById('suName').value.trim()
      }).then(function(result){
        if(result.confirmed){ showToast('Conta criada! Bem-vindo(a).'); renderNav(); location.hash='#/'; }
        else { showToast('Conta criada. Verifique seu e-mail para confirmar o acesso.'); location.hash='#/entrar'; }
      }).catch(function(err){ showToast('Erro ao criar conta: '+err.message); btn.disabled=false; });
    });
  }

  /* ---------- nav / router ---------- */
  function renderNav(){
    var el = document.getElementById('navActions');
    if(session && myProfile){
      el.innerHTML = '<a class="nav-link" href="#/" id="postNavLink">Postar</a>'
        + '<div class="dropdown"><button class="avatar-btn" id="avatarBtn" type="button">'+authorAvatar(myProfile,'sm')+'</button>'
        + '<div class="dropdown-menu" id="dropdownMenu">'
        + '<a href="#/perfil/'+encodeURIComponent(myProfile.username)+'">Meu perfil</a>'
        + '<a href="#/salvos">Salvos</a>'
        + '<a href="#/configuracoes">Configurações</a>'
        + '<button class="logout" id="logoutBtn" type="button">Sair</button></div></div>';
      document.getElementById('avatarBtn').addEventListener('click', function(e){ e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('open'); });
      document.getElementById('logoutBtn').addEventListener('click', function(){ signOut(); showToast('Você saiu.'); renderNav(); location.hash='#/'; });
      document.getElementById('postNavLink').addEventListener('click', function(e){
        if((location.hash||'#/')==='#/'){
          e.preventDefault();
          var el = document.getElementById('composeText'); if(el) el.focus();
        }
      });
    } else {
      el.innerHTML = '<a class="nav-link" href="#/entrar">Entrar</a><a class="btn btn-primary" href="#/criar-conta" style="padding:9px 18px;">Criar conta</a>';
    }
  }
  document.addEventListener('click', function(){ var m = document.getElementById('dropdownMenu'); if(m) m.classList.remove('open'); });

  document.getElementById('themeToggle').addEventListener('click', function(){
    theme = theme==='light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    this.textContent = theme==='light' ? '🌙' : '☀️';
  });

  document.getElementById('searchInput').addEventListener('input', debounce(function(){
    state.query = this.value;
    if(location.hash && location.hash!=='#/'){ location.hash='#/'; } else { renderHome(); }
  }, 350));

  function route(){
    var hash = location.hash || '#/';
    window.scrollTo(0,0);
    renderNav();
    if(hash.indexOf('#/post/')===0) return renderPost(decodeURIComponent(hash.replace('#/post/','')));
    if(hash.indexOf('#/perfil/')===0) return renderProfile(decodeURIComponent(hash.replace('#/perfil/','')));
    if(hash==='#/salvos') return renderSaved();
    if(hash==='#/configuracoes') return renderSettings();
    if(hash==='#/entrar') return renderLogin();
    if(hash==='#/criar-conta') return renderSignup();
    return renderHome();
  }

  function init(){
    showLoading('Carregando Letrum...');
    window.addEventListener('hashchange', route);
    route();
  }
  init();
})();
</script>
</body>
</html>
